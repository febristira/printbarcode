<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barcode Label 30 × 15 mm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --label-w: 30mm;
      --label-h: 15mm;
      --gap-x: 2mm;
      --side-margin: 1.3mm;
    }

    * {
      box-sizing: border-box;
    }

    .sheet {
      width: 100mm;
      margin: 0 auto;
      padding: 0 var(--side-margin);
    }

    .labels {
      display: grid;
      grid-template-columns: repeat(3, var(--label-w));
      column-gap: var(--gap-x);
      row-gap: 0;
      justify-content: start;
    }

    .label {
      width: var(--label-w);
      height: var(--label-h);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: .6mm 1mm .4mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .barcode {
      display: block;
      width: 27mm;
      height: 9mm;
    }

    .value {
      width: 100%;
      text-align: center;
      font: 7pt/1 Arial, sans-serif;
      margin-top: .3mm;
      overflow: hidden;
      white-space: nowrap;
    }

    @page {
      size: 100mm 150mm;
      margin: 0;
    }

    @media print {
      body {
        margin: 0;
      }

      .controls,
      .print\:hidden {
        display: none !important;
      }

      .sheet {
        width: 100mm;
        margin: 0;
        padding: 0 var(--side-margin);
      }

      .label {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>
  <div class="min-h-screen bg-slate-950 px-4 py-8 text-slate-900 print:bg-white print:p-0">
    <section class="controls mx-auto mb-8 max-w-5xl">
      <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <div
            class="mb-3 inline-flex items-center gap-2 rounded-full border border-indigo-400/20 bg-indigo-400/10 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-indigo-300">
            <span class="h-2 w-2 rounded-full bg-emerald-400"></span> Label Studio</div>
          <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Barcode Label <span
              class="text-indigo-400">30 × 15 mm</span></h1>
          <p class="mt-2 max-w-2xl text-sm text-slate-400">Buat label barcode siap cetak dengan susunan 3 kolom. Satu
            kode per baris.</p>
        </div>
        <div class="rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-right text-xs text-slate-400">
          <div class="font-semibold text-white">Kertas 100 × 150 mm</div>
          <div>Margin samping 1,3 mm · Gap 2 mm</div>
        </div>
      </div>
      <div
        class="grid gap-5 rounded-3xl border border-white/10 bg-white p-5 shadow-2xl shadow-indigo-950/30 sm:p-6 lg:grid-cols-[1.25fr_.75fr]">
        <div><label for="codes" class="mb-2 block text-sm font-semibold text-slate-700">Daftar kode</label><textarea
            id="codes"
            class="min-h-44 w-full resize-y rounded-2xl border border-slate-200 bg-slate-50 p-4 font-mono text-sm text-slate-700 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
            spellcheck="false" placeholder="Satu kode per baris">8991234567890
BRG-0002
BRG-0003
BRG-0004
BRG-0005
BRG-0006</textarea>
          <p class="mt-2 text-xs text-slate-400">Tip: tempel kode dalam jumlah banyak, setiap kode dipisahkan dengan
            baris baru.</p>
        </div>
        <div class="flex flex-col justify-between gap-5">
          <div class="space-y-4">
            <div><label for="format" class="mb-2 block text-sm font-semibold text-slate-700">Format
                barcode</label><select id="format"
                class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-700 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10">
                <option value="CODE128">Code 128 (umum)</option>
                <option value="EAN13">EAN-13 (13 digit)</option>
                <option value="CODE39">Code 39</option>
              </select></div><label class="flex cursor-pointer items-center gap-3 text-sm text-slate-600"><input
                type="checkbox" id="showText" checked
                class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"> Tampilkan kode di bawah
              barcode</label>
          </div>
          <div class="flex flex-wrap gap-3"><button id="generate"
              class="flex-1 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-500 active:scale-[.98]">Buat
              label</button><button id="print"
              class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition hover:border-indigo-300 hover:text-indigo-600 active:scale-[.98]">Cetak</button>
          </div><span id="status" role="status" class="text-xs font-medium text-slate-400"></span>
        </div>
      </div>
    </section>
    <main class="sheet">
      <div class="mb-3 flex items-center justify-between px-1 text-xs text-slate-400 print:hidden"><span>Preview
          cetak</span><span>Ukuran aktual 100 × 150 mm</span></div>
      <div class="rounded-2xl bg-white p-2 shadow-2xl shadow-black/20 print:rounded-none print:p-0 print:shadow-none">
        <div class="labels" id="labels"></div>
      </div>
    </main>
  </div>
  <script>
    (() => {
      const codesEl = document.getElementById('codes'), formatEl = document.getElementById('format'), showTextEl = document.getElementById('showText'), labelsEl = document.getElementById('labels'), statusEl = document.getElementById('status');
      function generate() { if (typeof JsBarcode === 'undefined') { statusEl.textContent = 'Library barcode belum termuat. Pastikan internet aktif, lalu refresh.'; return; } const codes = codesEl.value.split(/\r?\n/).map(v => v.trim()).filter(Boolean); labelsEl.replaceChildren(); let errors = 0; codes.forEach(code => { const label = document.createElement('div'); label.className = 'label'; const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.classList.add('barcode'); label.appendChild(svg); const value = document.createElement('div'); value.className = 'value'; value.textContent = showTextEl.checked ? code : ''; label.appendChild(value); try { JsBarcode(svg, code, { format: formatEl.value, displayValue: false, margin: 0, width: 1.15, height: 34, background: '#ffffff', lineColor: '#000000', valid: valid => { if (!valid) errors++; } }) } catch (e) { errors++; svg.remove(); value.textContent = code + ' — KODE TIDAK VALID'; } labelsEl.appendChild(label); }); statusEl.textContent = `${codes.length} label dibuat${errors ? ` · ${errors} kode perlu dicek` : ''}.`; }
      document.getElementById('generate').addEventListener('click', generate); document.getElementById('print').addEventListener('click', () => { generate(); window.print() }); generate();
    })();
  </script>
</body>

</html>
